<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Air Radio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot" aria-hidden="true"></span> Open Air Radio</div>
    <p class="tagline">One station. Anyone can be the DJ.</p>
  </header>

  <main>
    <section class="onair card" aria-labelledby="np-heading">
      <h2 id="np-heading" class="label">Now playing</h2>
      <div class="player-wrap">
        <div id="player"></div>
        <button id="tune-in" class="tune-in" hidden>▶ Tune in</button>
        <p id="player-msg" class="player-msg" hidden></p>
      </div>
      <div id="np-empty" class="empty" hidden>
        The station is quiet. Add the first song below and it starts playing for everyone.
      </div>
      <div id="np-info" hidden>
        <h3 id="np-title" class="np-title"></h3>
        <p class="np-by">picked by <strong id="np-name"></strong><span id="np-from"></span></p>
        <blockquote id="np-blurb" class="blurb"></blockquote>
        <div id="np-heart" class="np-heart"></div>
        <div class="progress" aria-hidden="true"><div id="np-bar"></div></div>
        <div class="times"><span id="np-elapsed">0:00</span><span id="np-total">0:00</span></div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="dj-voice"> Read the blurbs aloud between songs
      </label>
    </section>

    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading" class="label">Add a song</h2>
      <form id="add-form" autocomplete="off">
        <label>YouTube link
          <input id="f-url" type="url" placeholder="https://www.youtube.com/watch?v=…" required>
        </label>
        <div id="preview-wrap" class="preview" hidden><div id="preview"></div></div>
        <p id="preview-status" class="hint"></p>
        <label>Why should people hear this?
          <span class="hint">What does it mean to you? Where were you when you first heard it? What should people listen for?</span>
          <textarea id="f-blurb" minlength="100" maxlength="280" rows="4" required
            placeholder="The first time I heard this I was…"></textarea>
          <span id="blurb-count" class="hint"></span>
        </label>
        <label>Where are you listening from?
          <input id="f-location" maxlength="60" required placeholder="City, country">
        </label>
        <label>Your name <span class="hint">(optional)</span>
          <input id="f-name" maxlength="40" placeholder="Anonymous">
        </label>
        <button id="f-submit" type="submit" disabled>Add to the queue</button>
        <p id="form-msg" class="form-msg" role="status"></p>
      </form>
    </section>

    <section class="card" aria-labelledby="next-heading">
      <h2 id="next-heading" class="label">Up next <span id="queue-count" class="count"></span></h2>
      <ol id="up-next" class="tracks"></ol>
      <p id="next-empty" class="hint">Nothing queued, so the station is replaying past picks.</p>
    </section>

    <section class="card" aria-labelledby="recent-heading">
      <h2 id="recent-heading" class="label">Recently played</h2>
      <ol id="recent" class="tracks"></ol>
      <p id="recent-empty" class="hint">Nothing yet.</p>
    </section>
  </main>

  <script src="/app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
